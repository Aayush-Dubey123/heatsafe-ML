# ==============================================================================
# HeatSafe-ML — Scientific & Quality Thresholds Configuration
# ==============================================================================

satellite_ingestion:
  max_cloud_cover_percent: 20.0
  min_usable_scenes_training: 40
  min_scenes_per_season: 8

freshness_rules:
  max_scene_age_days: 16       # Flag stale if greater than two Landsat revisits
  max_weather_age_hours: 24     # Applicable when real-time weather covariates active

model_baselines:
  min_rmse_improvement_percent: 15.0  # Exit criterion vs spatial median baseline

# Phase 5 — dataset building, EDA, and baselines
dataset:
  train_start_date: "2019-01-01"
  train_end_date: "2025-12-31"
  min_scene_trainable_fraction: 0.30   # scenes below this (mostly cloud/fill) are excluded
  sample_pixels_per_scene: 20000       # random trainable pixels sampled per scene for modelling
  random_seed: 20261109

spatial_splits:
  block_size_meters: 2000.0            # Decision D5
  n_folds: 5                           # GroupKFold on block_id (D5)
  holdout_fraction: 0.20               # fixed test blocks, opened once in Phase 7 (D4/D5)
  random_seed: 20261109

eda:
  gi_star_radius_meters: 300.0         # distance band for Getis-Ord Gi*
  gi_star_min_valid_neighbours: 20
  gi_star_z_threshold: 1.96            # two-sided p < 0.05 (floor)
  gi_star_fdr_alpha: 0.05              # Benjamini-Hochberg false discovery rate
  correlation_sample_per_season: 200000

baselines:
  idw_neighbours: 12
  idw_power: 2.0

# Phase 8 — heat exposure, vulnerability, cooling assets
exposure:
  reference_area: "nmc_boundary"          # percentile ranks are computed among land pixels inside NMC
  level_breaks: [25.0, 50.0, 75.0, 90.0]  # index cut-offs between the five level codes
  level_codes: ["low", "moderate", "high", "very_high", "extreme"]
  bootstrap_resamples: 1000               # scene-level resamples for zone rank intervals
  random_seed: 20261110
  risk_season: "summer"                   # season used for the headline zone risk rank
  risk_weights: {exposure: 0.5, vulnerability: 0.5}
  vulnerability_weights: {population_density_per_km2: 0.3333, share_age_60_plus: 0.3333, green_deficit: 0.3334}

population:
  source: "WorldPop 2020, 1 km, unconstrained, not UN-adjusted (CC BY 4.0)"
  base_url: "https://data.worldpop.org/GIS"
  total_path: "Population/Global_2000_2020_1km/2020/IND/ind_ppp_2020_1km_Aggregated.tif"
  age_sex_path: "AgeSex_structures/Global_2000_2020_1km/unconstrained/2020/IND/ind_{sex}_{age}_2020_1km.tif"
  elderly_age_bands: [60, 65, 70, 75, 80]
  window_buffer_degrees: 0.03

cooling_assets:
  source: "OpenStreetMap via Overpass API (ODbL)"
  overpass_endpoint: "https://overpass-api.de/api/interpreter"
  user_agent: "HeatSafeML/1.0 (research; github.com/Aayush-Dubey123/heatsafe-ML)"
  categories:
    green_space: {key: "leisure", values: ["park", "garden"]}
    water_body: {key: "natural", values: ["water"]}
    health_facility: {key: "amenity", values: ["hospital", "clinic"]}
    public_shelter: {key: "amenity", values: ["shelter", "community_centre"]}
    drinking_water: {key: "amenity", values: ["drinking_water"]}
