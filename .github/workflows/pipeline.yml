name: HeatSafe-ML Pipeline

# Daily check for a new Landsat 8/9 scene (Phase 10).
#
# A runner starts empty, so it first restores the model, terrain, scene index and
# map layers from the free Hugging Face dataset repo, runs the pipeline once, and
# the pipeline uploads the new bundle and refreshed state back.
#
# Enable by setting the repository variable HEATSAFE_PIPELINE_ENABLED to "true"
# (Settings -> Secrets and variables -> Actions -> Variables). Required secret:
# HEATSAFE_STORAGE_TOKEN. Optional secret: HEATSAFE_DATABASE_URL (serving database).
# Manual runs are possible from the Actions tab at any time.
on:
  schedule:
    - cron: "30 7 * * *"   # 13:00 IST, a few hours after the ~10:00 local overpass
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heatsafe-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    name: Detect, process, and publish new scene
    if: ${{ vars.HEATSAFE_PIPELINE_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: "."
      HEATSAFE_STORAGE_TOKEN: ${{ secrets.HEATSAFE_STORAGE_TOKEN }}
      HEATSAFE_DATABASE_URL: ${{ secrets.HEATSAFE_DATABASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore model, terrain, scene index, and map layers
        run: python -m ml.src.publish.storage restore-state

      - name: Restore the last published bundle
        run: python -m ml.src.publish.storage restore-bundle

      - name: Run pipeline once
        run: python -m ml.src.pipeline.run_batch
