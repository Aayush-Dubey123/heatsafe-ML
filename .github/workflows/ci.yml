name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend Lint, Syntax & Fast Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install system audio dependencies (FFmpeg & libsndfile)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Upgrade pip and install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install core dependencies
        run: |
          pip install -r requirements.txt

      - name: Bytecode compilation & syntax audit
        run: |
          python -m compileall backend/

      - name: Verify core package imports
        run: |
          python -c "import fastapi, uvicorn, pydantic, pydantic_settings, sqlalchemy, soundfile, librosa, pytest, httpx, torch; print('All core dependencies and PyTorch imported successfully')"

      - name: Ensure storage directories exist
        run: |
          mkdir -p backend/storage/tmp backend/storage/output backend/logs

      - name: Run fast backend tests (excluding slow/GPU models)
        working-directory: backend
        run: |
          pytest -v -m "not slow"

  frontend-ci:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend code
        working-directory: frontend
        run: npm run lint

      - name: Typecheck and build frontend production bundle
        working-directory: frontend
        run: npm run build

