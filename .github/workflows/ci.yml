name: HeatSafe-ML CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-and-ml-ci:
    name: Backend & ML Lint, Syntax & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Upgrade pip and install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bytecode compilation & syntax audit
        run: |
          python -m compileall backend/ ml/

      - name: Verify core package imports
        run: |
          python -c "import fastapi, uvicorn, pydantic, sqlalchemy, numpy, scipy, pandas, shapely, rasterio, sklearn, lightgbm, yaml, pytest, httpx; print('All HeatSafe-ML core dependencies imported successfully')"

      - name: Run automated test suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          pytest -v
