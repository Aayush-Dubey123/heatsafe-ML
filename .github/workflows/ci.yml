name: HeatSafe-ML CI

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: "."
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
  RUFF_ARGS: >-
    --line-length 120 --target-version py312
    --select E,F,W,I,B,S,UP --ignore B008
    --per-file-ignores backend/tests/*:S101,ml/tests/*:S101
  MYPY_ARGS: >-
    --python-version 3.13 --ignore-missing-imports
    --explicit-package-bases --no-site-packages --exclude backend/tests/

jobs:
  quality-and-tests:
    name: Lint, Types, Audit & Tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bytecode compilation & syntax audit
        run: python -m compileall -q backend/ ml/

      - name: Ruff lint, including hardcoded-secret rules (backend + Phase 5+ ML modules)
        run: ruff check backend ml/src/dataset ml/src/eda ml/src/models ml/src/validation ml/src/exposure ml/tests/dataset ml/tests/eda ml/tests/models ml/tests/validation ml/tests/exposure $RUFF_ARGS

      - name: Mypy type check (backend + Phase 5+ ML modules)
        run: mypy backend ml/src/dataset ml/src/eda ml/src/models ml/src/validation ml/src/exposure $MYPY_ARGS

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: Run automated test suite
        run: python -m pytest -v -p no:cacheprovider

  postgres-integration:
    name: Migrations & Backend Tests (PostgreSQL + PostGIS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: heatsafe_ci
          POSTGRES_USER: heatsafe
          POSTGRES_PASSWORD: ${{ github.run_id }}-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heatsafe -d heatsafe_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HEATSAFE_TEST_DATABASE_URL: postgresql+psycopg://heatsafe:${{ github.run_id }}-ci-only@localhost:5432/heatsafe_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backend tests against PostgreSQL (runs Alembic upgrade/downgrade)
        run: python -m pytest backend -v -p no:cacheprovider
