name: HeatSafe-ML API image

# Builds the production API image and publishes it to GitHub Container Registry (free for public
# repositories), so Render can deploy it with "Existing image" instead of building 1.5 GB itself.
# Image: ghcr.io/<owner in lower case>/heatsafe-api:latest
on:
  push:
    branches: [ main ]
    paths:
      - Dockerfile
      - requirements.txt
      - backend/**
      - ml/src/**
      - ml/configs/**
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: heatsafe-image
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and publish the API image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Work out the image name (registry names must be lower case)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/heatsafe-api" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
