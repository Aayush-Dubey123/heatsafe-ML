version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      web-stack:
        patterns: ["fastapi", "starlette", "uvicorn*", "pydantic*", "python-multipart", "python-dotenv"]
      geo-ml-stack:
        patterns: ["numpy", "scipy", "pandas", "shapely", "rasterio", "pyarrow", "scikit-learn", "lightgbm"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
