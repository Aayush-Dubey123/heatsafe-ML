# HeatSafe-ML Alembic configuration.
# The database URL is NOT stored here; env.py reads it from HEATSAFE_DATABASE_URL
# via backend.core.config.settings.
#
# Usage (from the repository root):
#   alembic -c backend/alembic.ini upgrade head
#   alembic -c backend/alembic.ini revision --autogenerate -m "describe change"
#
# Rule A: keep backend/migrations/versions/ at <= 2 migration files until the
# v1 release by squashing pre-release migrations (Decision T8).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..
path_separator = os
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
